<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merhaba Dünya</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #22c55e, #15803d);
  }
  .card {
    background: #ffffff;
    padding: 48px 40px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 420px;
  }
  h1 {
    margin: 0 0 12px;
    color: #1f2937;
    font-size: 28px;
  }
  p {
    margin: 0 0 24px;
    color: #6b7280;
    line-height: 1.5;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  }
  button {
    background: #ef4444;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #dc2626;
  }
  #sayac {
    margin-top: 16px;
    font-weight: bold;
    color: #4f46e5;
  }
</style>
</head>
<body>
  <div class="card">
    <p>Bu basit bir web sayfası örneğidir. Aşağıdaki butona tıklayarak dener misin?</p>
    <button onclick="tikla()">Bana Tıkla</button>
    <div id="sayac">Tıklama sayısı: 0</div>
  </div>

  <script>
    let sayi = 0;
    function tikla() {
      sayi++;
      document.getElementById('sayac').textContent = 'Tıklama sayısı: ' + sayi;
    }
  </script>
</body>
</html>
